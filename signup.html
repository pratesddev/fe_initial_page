<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Carregando a fonte roboto para usar no projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <section class="left">
      <h1>Nova Conta</h1>
      <form action="" class="form">
        <input class="input" type="text" name="" id="" placeholder="Digite seu nome">
        <input class="input" type="email" name="" id="" placeholder="Digite seu email">
        <input class="input" type="password" name="" id="" placeholder="Digite sua senha">
        <div class="area">
            <input type="radio" name="termos" id="termos" class="termos">
            <span>Concordo com os termos</span>
        </div>
        <button class="button" type="submit">Nova Conta</button>
      </form>
      <div class="area">
        <span class="link">Já possui uma conta? <a href="index.html">Faça login</a></span>
      </div>
    </section>
    <section class="right">
      <img class="info-img" src="assets/info.png" alt="Informações do projeto">
      <h2 class="subtitle">Leve sua carreira ao póximo nível</h2>
      <p class="description">Ad commodo magna commodo eu. Ea consequat mollit ea consectetur labore id dolore minim
        culpa quis est do.
        Nostrud sit irure eiusmod enim exercitation nulla est.</p>
    </section>
  </main>
</body>

</html>
